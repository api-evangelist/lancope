name: Lancope
description: Lancope was an Atlanta, Georgia based network security company best known
  for StealthWatch, a NetFlow-based network visibility and security analytics platform
  that used flow telemetry from existing routers and switches to detect internal threats,
  lateral movement, and anomalous behavior without deploying inline sensors. Lancope
  was acquired by Cisco Systems on December 22, 2015 for approximately $452.5 million
  to advance Cisco's "Security Everywhere" strategy. StealthWatch was folded into Cisco's
  security portfolio, rebranded Cisco Stealthwatch Enterprise and later, from version
  7.4.0, Cisco Secure Network Analytics. Lancope no longer operates as an independent
  company and publishes no developer portal, API, or SDK of its own - lancope.com now
  redirects to the Cisco Secure Network Analytics product page. The programmable surface
  descended from StealthWatch (the Secure Network Analytics REST APIs, plus the deprecated
  SOAP Web Services API) is documented by Cisco on developer.cisco.com and is catalogued
  in the API Evangelist network under the Cisco provider repositories rather than here.
